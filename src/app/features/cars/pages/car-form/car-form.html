<form [formGroup]="carForm" (ngSubmit)="onSubmit()" class="car-form">
  <h2>Car Details Form</h2>


  <!-- Make Field -->
  <mat-form-field >
    <mat-label>Make</mat-label>
    <input matInput formControlName="make" placeholder="e.g. Toyota" />
  </mat-form-field>


  <!-- Model Field -->
  <mat-form-field >
    <mat-label>Model</mat-label>
    <input matInput formControlName="model" placeholder="e.g. Corolla" />
  </mat-form-field>
    


  <!-- Year Field -->
  <mat-form-field>
    <mat-hint>Optional</mat-hint>
    <mat-label>Year</mat-label>
    <input matInput type="number" formControlName="year" placeholder="e.g. 2022" />
  </mat-form-field>



  @if (saveError(); as message) { <p role="alert">{{ message }}</p> }
  <div class="button-group">
    <button type="submit" [disabled]="saving()">
      {{ saving() ? 'Saving...' : 'Save car' }}
    </button>
    
    <button>
        <a routerLink="/cars">Cancel</a>
    </button>
    
  </div>

</form>
